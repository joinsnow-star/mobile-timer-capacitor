<body class="text-gray-700">
    <video autoplay muted loop playsinline id="video-bg"> </video>

        </div>

                    <ul></ul>
                 </div>

    <script>
        // === DOM Elements & State ===
        const mainTimerDisplay = document.getElementById('main-timer');
        const timerLabel = document.getElementById('timer-label');
        const startPauseButton = document.getElementById('start-pause-button');
        const resetButton = document.getElementById('reset-button');
        const microBreakTimerDisplay = document.getElementById('micro-break-timer');
        const microBreakLogUl = document.querySelector('#micro-break-log ul');
        const pauseLogUl = document.querySelector('#pause-log ul');
        const pauseLogCountSpan = document.getElementById('pause-log-count');
        const mainSwitchAudio = document.getElementById('main-switch-audio');
        const microBreakAudio = document.getElementById('micro-break-audio');
        const mainTimerBox = document.getElementById('main-timer-box');
        const microBreakBox = document.getElementById('micro-break-box');
        let uiIsPaused = true;
        let uiIsWorking = true;
        let isAudioContextStarted = false; // Flag for Tone.js initialization

        // === SETTINGS Elements ===
        const settingsButton = document.getElementById('settings-button');
        const closeSettingsButton = document.getElementById('close-settings-button');
        const settingsPanel = document.getElementById('settings-panel');
        const settingsContent = document.querySelector('.settings-content');
        const settingsOverlay = document.getElementById('settings-overlay');
        const workDurationInput = document.getElementById('work-duration-input');
        const restDurationInput = document.getElementById('rest-duration-input');
        const microBreakDurationInput = document.getElementById('micro-break-duration-input');
        const minIntervalInput = document.getElementById('min-interval-input');
        const maxIntervalInput = document.getElementById('max-interval-input');
        const applyTimeSettingsButton = document.getElementById('apply-time-settings');
        const bgTypeSelect = document.getElementById('bg-type');
        const bgImageSettings = document.getElementById('bg-image-settings');
        const bgVideoSettings = document.getElementById('bg-video-settings');
        const bgImageUrlInput = document.getElementById('bg-image-url');
        const bgImageFileInput = document.getElementById('bg-image-file');
        const bgVideoUrlInput = document.getElementById('bg-video-url');
        const bgVideoFileInput = document.getElementById('bg-video-file');
        const applyBackgroundButton = document.getElementById('apply-background');
        const videoBgElement = document.getElementById('video-bg');
        const timerOpacitySlider = document.getElementById('timer-opacity-slider');
        const timerOpacityValue = document.getElementById('timer-opacity-value');
        const mainSoundSelect = document.getElementById('main-sound-select');
        const mainSoundFile = document.getElementById('main-sound-file');
        const microSoundSelect = document.getElementById('micro-sound-select');
        const microSoundFile = document.getElementById('micro-sound-file');

        // === MUSIC PLAYER Elements & State ===
        const musicUploadInput = document.getElementById('music-upload');
        const playlistElement = document.getElementById('playlist');
        const musicPlayerAudio = document.getElementById('music-player-audio');
        const playPauseMusicButton = document.getElementById('play-pause-music-button');
        const prevButton = document.getElementById('prev-button');
        const nextButton = document.getElementById('next-button');
        const playbackModeRadios = document.querySelectorAll('input[name="playbackMode"]');
        const currentTrackInfoElement = document.getElementById('current-track-info');
        const clearPlaylistButton = document.getElementById('clear-playlist-button');
        let playlist = [];
        let currentTrackIndex = -1;
        let isMusicPlaying = false;
        let currentPlaybackMode = 'sequential';

        // === Web Worker Setup ===
        let timerWorker;
        if (window.Worker) {
            try {
                console.log("Attempting to create Timer Worker...");
                timerWorker = new Worker('timer-worker.js');
                console.log("Timer Worker created successfully.");

                timerWorker.onmessage = function(event) {
                    const data = event.data;
                    // console.log("Main received message:", data); // Verbose log

                    switch (data.type) {
                        case 'tick':
                            updateUIFromWorker(data);
                            break;
                        case 'playSound':
                            if (isAudioContextStarted) { // Only play if context is ready
                                if (data.sound === 'main') { playMainSwitchSound(); }
                                else if (data.sound === 'micro') { playMicroBreakSound(); }
                            } else {
                                console.warn("Audio context not started, skipping sound:", data.sound);
                            }
                            break;
                        case 'logMicroBreak':
                            logMicroBreak();
                            break;
                        case 'clearLogs':
                            clearAllLogs();
                            break;
                        default:
                            console.warn("Received unknown message type from worker:", data.type);
                    }
                };

                timerWorker.onerror = function(error) {
                    console.error("Error in Timer Worker:", error.message, error);
                    alert("计时器后台线程出错，请尝试刷新页面。");
                };

            } catch (e) {
                console.error("Failed to create Timer Worker:", e);
                alert("无法创建后台计时器线程。计时器可能无法在后台运行。");
                timerWorker = null; // Ensure worker is null if creation failed
            }
        } else {
            console.error("Web Workers are not supported in this browser.");
            alert("你的浏览器不支持后台计时器所需的功能，计时器可能在后台无法正常工作。");
        }

        // --- Audio Synthesis (Tone.js) ---
        const synth = new Tone.Synth().toDestination();
        const synth2 = new Tone.PolySynth(Tone.Synth).toDestination();
        let playMainSwitchSound = () => { if (!isAudioContextStarted) return; synth2.triggerAttackRelease(["C4", "E4", "G4"], "1n"); console.log("Playing main switch sound"); };
        let playMicroBreakSound = () => { if (!isAudioContextStarted) return; synth.triggerAttackRelease("C5", "8n"); console.log("Playing micro break sound"); };

        // --- Function to start Audio Context ---
        async function startAudioContext() {
            if (isAudioContextStarted || Tone.context.state === 'running') {
                isAudioContextStarted = true; // Ensure flag is set even if already running
                return true;
            }
            try {
                await Tone.start();
                isAudioContextStarted = true;
                console.log("Audio context started successfully via Tone.start() on user interaction.");
                return true;
            } catch (e) {
                console.error("Error starting AudioContext:", e);
                alert("无法启动音频，提示音可能无法播放。");
                return false;
            }
        }

        // --- Utility Functions ---
        function formatTime(seconds) { const mins = Math.floor(seconds / 60); const secs = seconds % 60; return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`; }
        function formatTimestamp(timestamp) { const date = new Date(timestamp); return date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' }); }

        // --- Display Update Functions ---
        function updateUIFromWorker(data) {
            mainTimerDisplay.textContent = formatTime(data.currentMainTime);
            uiIsPaused = data.isPaused;
            uiIsWorking = data.isWorking;
            if (uiIsPaused) { startPauseButton.textContent = '继续'; timerLabel.textContent = uiIsWorking ? '专注暂停' : '休息暂停'; }
            else { startPauseButton.textContent = '暂停'; timerLabel.textContent = uiIsWorking ? '专注中...' : '休息一下'; }
            if (data.isMicroBreaking) { microBreakTimerDisplay.textContent = formatTime(data.currentMicroBreakCountdown); microBreakTimerDisplay.classList.remove('text-gray-500'); microBreakTimerDisplay.classList.add('text-purple-500'); }
            else { microBreakTimerDisplay.textContent = '--:--'; microBreakTimerDisplay.classList.add('text-gray-500'); microBreakTimerDisplay.classList.remove('text-purple-500'); }
            updatePauseLogDisplay(data.pauseCount, data.pauseLog);
            // Update title only if needed (less frequent updates might be better for performance)
            document.title = `${formatTime(data.currentMainTime)} - ${uiIsWorking ? '专注' : '休息'}${uiIsPaused ? ' (暂停)' : ''}`;
        }
        function logMicroBreak() { const now = new Date(); const timeString = now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }); const li = document.createElement('li'); li.textContent = `小憩 @ ${timeString}`; microBreakLogUl.appendChild(li); microBreakLogUl.scrollTop = microBreakLogUl.scrollHeight; }
        function updatePauseLogDisplay(count, logData) { if (!pauseLogCountSpan || !pauseLogUl) return; pauseLogCountSpan.textContent = count; pauseLogUl.innerHTML = ''; if (logData && logData.length > 0) { logData.forEach(timestamp => { const li = document.createElement('li'); li.textContent = `暂停 @ ${formatTimestamp(timestamp)}`; pauseLogUl.appendChild(li); }); pauseLogUl.scrollTop = pauseLogUl.scrollHeight; } }
        function clearAllLogs() { if (microBreakLogUl) microBreakLogUl.innerHTML = ''; if (pauseLogUl) pauseLogUl.innerHTML = ''; if (pauseLogCountSpan) pauseLogCountSpan.textContent = '0'; }

        // --- Timer Control Functions (Send commands to worker) ---
        function pauseTimerCommand() { console.log("Sending PAUSE command to worker"); if (timerWorker) timerWorker.postMessage({ command: 'pause' }); }
        function resumeTimerCommand() { console.log("Sending START command to worker"); if (timerWorker) timerWorker.postMessage({ command: 'start' }); }
        function resetTimerCommand() { console.log("Sending RESET command to worker"); if (timerWorker) timerWorker.postMessage({ command: 'reset' }); }

        // --- Settings Logic Functions ---
        function applyTimeSettings() { console.log("Apply time settings button clicked"); const newWorkMin = parseInt(workDurationInput.value, 10); const newRestMin = parseInt(restDurationInput.value, 10); const newMicroSec = parseInt(microBreakDurationInput.value, 10); const newMinIntMin = parseInt(minIntervalInput.value, 10); const newMaxIntMin = parseInt(maxIntervalInput.value, 10); if (isNaN(newWorkMin) || newWorkMin < 1 || isNaN(newRestMin) || newRestMin < 1 || isNaN(newMicroSec) || newMicroSec < 5 || isNaN(newMinIntMin) || newMinIntMin < 1 || isNaN(newMaxIntMin) || newMaxIntMin < 1) { alert("请输入有效的时间数值 (所有时间需 > 0, 小憩时间 >= 5秒)。"); return; } if (newMinIntMin > newMaxIntMin) { alert("小憩间隔的最小值不能大于最大值。"); return; } const newSettings = { workDuration: newWorkMin * 60, restDuration: newRestMin * 60, microBreakDuration: newMicroSec, minMicroInterval: newMinIntMin * 60, maxMicroInterval: newMaxIntMin * 60 }; console.log("Sending new time settings to worker:", newSettings); if (timerWorker) { timerWorker.postMessage({ command: 'updateSettings', data: newSettings }); } alert("时间设置已发送，计时器将重置！"); closeSettings(); }
        function initializeTimeInputs() { workDurationInput.value = 90; restDurationInput.value = 20; microBreakDurationInput.value = 10; minIntervalInput.value = 8; maxIntervalInput.value = 10; }
        function updateTimerBoxOpacity() { const opacityValue = parseInt(timerOpacitySlider.value, 10); const alpha = opacityValue / 100; timerOpacityValue.textContent = `${opacityValue}%`; mainTimerBox.style.backgroundColor = `rgba(255, 255, 255, ${alpha})`; microBreakBox.style.backgroundColor = `rgba(255, 255, 255, ${alpha})`; }
        function applyBackgroundSettings() { console.log("Apply background button clicked"); const type = bgTypeSelect.value; const imageUrl = bgImageUrlInput.value.trim(); const imageFile = bgImageFileInput.files[0]; const videoUrl = bgVideoUrlInput.value.trim(); const videoFile = bgVideoFileInput.files[0]; document.body.style.backgroundImage = ''; document.body.style.background = ''; videoBgElement.style.opacity = '0'; videoBgElement.src = ''; if (type === 'gradient') { document.body.style.background = 'linear-gradient(135deg, #f3e7e9 0%, #e3eeff 100%)'; document.body.style.backgroundAttachment = 'fixed'; } else if (type === 'image') { let urlToApply = ''; if (imageFile) { urlToApply = URL.createObjectURL(imageFile); } else if (imageUrl) { urlToApply = imageUrl; } if (urlToApply) { document.body.style.backgroundImage = `url('${urlToApply}')`; document.body.style.backgroundSize = 'cover'; document.body.style.backgroundPosition = 'center'; document.body.style.backgroundAttachment = 'fixed'; } else { document.body.style.background = 'linear-gradient(135deg, #f3e7e9 0%, #e3eeff 100%)'; document.body.style.backgroundAttachment = 'fixed'; alert("请输入图片URL或选择一个文件。"); } } else if (type === 'video') { let urlToApply = ''; if (videoFile) { urlToApply = URL.createObjectURL(videoFile); } else if (videoUrl) { urlToApply = videoUrl; } if (urlToApply) { videoBgElement.src = urlToApply; videoBgElement.style.opacity = '0.8'; } else { document.body.style.background = 'linear-gradient(135deg, #f3e7e9 0%, #e3eeff 100%)'; document.body.style.backgroundAttachment = 'fixed'; alert("请输入视频URL或选择一个文件。"); } } closeSettings(); }
        function updateMainSound() { const selection = mainSoundSelect.value; mainSwitchAudio.src = ''; switch (selection) { case 'gentle-chime': playMainSwitchSound = () => { if (!isAudioContextStarted) return; synth2.triggerAttackRelease(["C5", "E5", "G5", "C6"], "1n", Tone.now()); }; break; case 'harp-pluck': playMainSwitchSound = () => { if (!isAudioContextStarted) return; synth2.triggerAttackRelease(["D4", "F#4", "A4", "D5"], "0.5n", Tone.now()); }; break; default: playMainSwitchSound = () => { if (!isAudioContextStarted) return; synth2.triggerAttackRelease(["C4", "E4", "G4"], "1n", Tone.now()); }; break; } console.log(`Main sound set to: ${selection}`); }
        function updateMicroSound() { const selection = microSoundSelect.value; microBreakAudio.src = ''; switch (selection) { case 'soft-bell': playMicroBreakSound = () => { if (!isAudioContextStarted) return; synth.triggerAttackRelease("E5", "8n", Tone.now()); }; break; case 'water-drop': playMicroBreakSound = () => { if (!isAudioContextStarted) return; synth.triggerAttackRelease("G5", "16n", Tone.now()); }; break; default: playMicroBreakSound = () => { if (!isAudioContextStarted) return; synth.triggerAttackRelease("C5", "8n", Tone.now()); }; break; } console.log(`Micro sound set to: ${selection}`); }
        function handleMainSoundFileChange(e) { if (e.target.files && e.target.files[0]) { const file = e.target.files[0]; const url = URL.createObjectURL(file); mainSwitchAudio.src = url; playMainSwitchSound = () => { if (!isAudioContextStarted) return; mainSwitchAudio.currentTime = 0; mainSwitchAudio.play().catch(e => console.error("Error playing main sound:", e)); }; console.log("Custom main sound loaded."); } }
        function handleMicroSoundFileChange(e) { if (e.target.files && e.target.files[0]) { const file = e.target.files[0]; const url = URL.createObjectURL(file); microBreakAudio.src = url; playMicroBreakSound = () => { if (!isAudioContextStarted) return; microBreakAudio.currentTime = 0; microBreakAudio.play().catch(e => console.error("Error playing micro sound:", e)); }; console.log("Custom micro sound loaded."); } }

        // --- Music Player Logic Functions ---
        function updatePlaylistDisplay() { playlistElement.innerHTML = ''; if (playlist.length === 0) { playlistElement.innerHTML = '<li class="text-gray-400 italic px-3 py-2">暂无音乐，请上传...</li>'; currentTrackInfoElement.textContent = '未播放'; return; } playlist.forEach((track, index) => { const li = document.createElement('li'); const trackNameSpan = document.createElement('span'); trackNameSpan.textContent = track.name; trackNameSpan.classList.add('track-name'); trackNameSpan.addEventListener('click', () => { console.log(`Playlist item ${index} clicked`); playTrack(index); }); const removeBtn = document.createElement('button'); removeBtn.innerHTML = '<i class="fas fa-times"></i>'; removeBtn.classList.add('remove-track-btn'); removeBtn.title = '移除此歌曲'; removeBtn.addEventListener('click', (event) => { event.stopPropagation(); console.log(`Remove track button ${index} clicked`); removeTrack(index); }); li.appendChild(trackNameSpan); li.appendChild(removeBtn); li.dataset.index = index; if (index === currentTrackIndex) { li.classList.add('playing'); } playlistElement.appendChild(li); }); }
        function removeTrack(indexToRemove) { if (indexToRemove < 0 || indexToRemove >= playlist.length) return; const removedTrack = playlist[indexToRemove]; console.log(`Removing track ${indexToRemove}: ${removedTrack.name}`); URL.revokeObjectURL(removedTrack.url); playlist.splice(indexToRemove, 1); if (indexToRemove === currentTrackIndex) { musicPlayerAudio.pause(); musicPlayerAudio.src = ''; isMusicPlaying = false; currentTrackIndex = -1; currentTrackInfoElement.textContent = '未播放'; updatePlayPauseButton(); if (playlist.length > 0) { playTrack(Math.min(indexToRemove, playlist.length - 1)); } } else if (indexToRemove < currentTrackIndex) { currentTrackIndex--; } updatePlaylistDisplay(); }
        function clearPlaylist() { if (playlist.length === 0) return; if (!confirm("确定要清空整个播放列表吗？")) { return; } console.log("Clearing playlist"); musicPlayerAudio.pause(); musicPlayerAudio.src = ''; isMusicPlaying = false; playlist.forEach(track => URL.revokeObjectURL(track.url)); playlist = []; currentTrackIndex = -1; updatePlaylistDisplay(); updatePlayPauseButton(); currentTrackInfoElement.textContent = '未播放'; }
        function handleMusicUpload(event) { console.log("Music upload input changed"); const files = event.target.files; if (!files || files.length === 0) return; for (let i = 0; i < files.length; i++) { const file = files[i]; if (file.type.startsWith('audio/')) { playlist.push({ name: file.name, url: URL.createObjectURL(file) }); } } updatePlaylistDisplay(); if (playlist.length > 0 && currentTrackIndex === -1) { currentTrackIndex = 0; loadTrack(currentTrackIndex); } updatePlayPauseButton(); event.target.value = null; }
        function loadTrack(index) { if (index < 0 || index >= playlist.length) { console.error("Invalid track index"); currentTrackInfoElement.textContent = '加载失败'; return; } musicPlayerAudio.src = playlist[index].url; musicPlayerAudio.load(); currentTrackIndex = index; updatePlaylistDisplay(); currentTrackInfoElement.textContent = `正在加载: ${playlist[index].name}`; console.log(`Loading track ${index}: ${playlist[index].name}`); }
        function playTrack(index = currentTrackIndex) { startAudioContext().then(success => { if (!success) return; console.log(`Attempting to play track ${index}`); if (index < 0 || index >= playlist.length) { if (playlist.length > 0) index = 0; else return; } if (index !== currentTrackIndex || musicPlayerAudio.src !== playlist[index].url) { loadTrack(index); musicPlayerAudio.addEventListener('canplay', () => { musicPlayerAudio.play().then(() => { isMusicPlaying = true; updatePlayPauseButton(); console.log(`Playing track ${index} after load`); }).catch(e => console.error("Error playing audio:", e)); }, { once: true }); } else { musicPlayerAudio.play().then(() => { isMusicPlaying = true; updatePlayPauseButton(); console.log(`Playing track ${index} directly`); }).catch(e => console.error("Error playing audio:", e)); } }); }
        function pauseTrack() { musicPlayerAudio.pause(); isMusicPlaying = false; updatePlayPauseButton(); console.log("Music paused"); }
        function togglePlayPauseMusic() { console.log("Play/Pause music button clicked"); if (playlist.length === 0) return; if (isMusicPlaying) { pauseTrack(); } else { if (currentTrackIndex === -1 && playlist.length > 0) { currentTrackIndex = 0; } playTrack(currentTrackIndex); } }
        function updatePlayPauseButton() { const icon = playPauseMusicButton.querySelector('i'); if (isMusicPlaying) { icon.classList.remove('fa-play'); icon.classList.add('fa-pause'); } else { icon.classList.remove('fa-pause'); icon.classList.add('fa-play'); } }
        function playNext() { console.log("Next music button clicked"); if (playlist.length === 0) return; let nextIndex; switch (currentPlaybackMode) { case 'random': nextIndex = Math.floor(Math.random() * playlist.length); if (playlist.length > 1) { while (nextIndex === currentTrackIndex) { nextIndex = Math.floor(Math.random() * playlist.length); } } break; case 'loop': playTrack(currentTrackIndex); return; default: nextIndex = (currentTrackIndex + 1) % playlist.length; break; } playTrack(nextIndex); }
        function playPrevious() { console.log("Previous music button clicked"); if (playlist.length === 0) return; let prevIndex; switch (currentPlaybackMode) { case 'random': prevIndex = Math.floor(Math.random() * playlist.length); if (playlist.length > 1) { while (prevIndex === currentTrackIndex) { prevIndex = Math.floor(Math.random() * playlist.length); } } break; case 'loop': prevIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length; break; default: prevIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length; break; } playTrack(prevIndex); }
        function handleTrackEnd() { console.log("Music Track ended"); isMusicPlaying = false; if (currentPlaybackMode === 'loop') { playTrack(currentTrackIndex); } else { playNext(); } }
        function updatePlaybackMode() { currentPlaybackMode = document.querySelector('input[name="playbackMode"]:checked').value; musicPlayerAudio.loop = false; console.log("Playback mode set to:", currentPlaybackMode); }

        // --- Event Listeners ---
        function addSafeEventListener(element, event, handler, options) { if (element) { element.addEventListener(event, handler, options); } else { console.error(`Element not found for event listener: ${event}`); } }

        addSafeEventListener(startPauseButton, 'click', async () => {
             console.log("Start/Pause button clicked");
             const audioReady = await startAudioContext(); // Ensure audio is ready
             if (!audioReady) return; // Don't proceed if audio failed
             if (uiIsPaused) { resumeTimerCommand(); } else { pauseTimerCommand(); }
        });
        addSafeEventListener(resetButton, 'click', async () => {
            console.log("Reset button clicked");
            const audioReady = await startAudioContext(); // Ensure audio is ready
             if (!audioReady) return;
            resetTimerCommand();
        });
        function openSettings() { console.log("Settings button clicked - opening"); initializeTimeInputs(); settingsPanel.classList.add('open'); settingsOverlay.classList.add('open'); }
        function closeSettings() { console.log("Closing settings"); settingsPanel.classList.remove('open'); settingsOverlay.classList.remove('open'); }
        addSafeEventListener(settingsButton, 'click', openSettings);
        addSafeEventListener(closeSettingsButton, 'click', closeSettings);
        addSafeEventListener(settingsOverlay, 'click', closeSettings);
        addSafeEventListener(applyTimeSettingsButton, 'click', applyTimeSettings);
        addSafeEventListener(bgTypeSelect, 'change', (e) => { const type = e.target.value; bgImageSettings.classList.toggle('hidden', type !== 'image'); bgVideoSettings.classList.toggle('hidden', type !== 'video'); });
        addSafeEventListener(applyBackgroundButton, 'click', applyBackgroundSettings);
        addSafeEventListener(timerOpacitySlider, 'input', updateTimerBoxOpacity);
        addSafeEventListener(mainSoundSelect, 'change', (e) => { mainSoundFile.classList.toggle('hidden', e.target.value !== 'custom'); if (e.target.value !== 'custom') updateMainSound(); });
        addSafeEventListener(microSoundSelect, 'change', (e) => { microSoundFile.classList.toggle('hidden', e.target.value !== 'custom'); if (e.target.value !== 'custom') updateMicroSound(); });
        addSafeEventListener(mainSoundFile, 'change', handleMainSoundFileChange);
        addSafeEventListener(microSoundFile, 'change', handleMicroSoundFileChange);
        // Music player listeners
        addSafeEventListener(musicUploadInput, 'change', handleMusicUpload);
        addSafeEventListener(playPauseMusicButton, 'click', togglePlayPauseMusic);
        addSafeEventListener(prevButton, 'click', playPrevious);
        addSafeEventListener(nextButton, 'click', playNext);
        addSafeEventListener(musicPlayerAudio, 'ended', handleTrackEnd);
        addSafeEventListener(musicPlayerAudio, 'play', () => { if (currentTrackIndex !== -1) { currentTrackInfoElement.textContent = `正在播放: ${playlist[currentTrackIndex].name}`; } });
        addSafeEventListener(musicPlayerAudio, 'pause', () => { if (musicPlayerAudio.ended) return; if (currentTrackIndex !== -1) { currentTrackInfoElement.textContent = `已暂停: ${playlist[currentTrackIndex].name}`; } });
        playbackModeRadios.forEach(radio => { addSafeEventListener(radio, 'change', updatePlaybackMode); });
        addSafeEventListener(clearPlaylistButton, 'click', clearPlaylist);

        // --- Initial Setup ---
        console.log("Initializing application...");
        initializeTimeInputs();
        // Don't reset timer on load, let worker send initial state
        updateMainSound();
        updateMicroSound();
        updatePlaylistDisplay();
        updatePlayPauseButton();
        updatePlaybackMode();
        updateTimerBoxOpacity();
        // Request initial state from worker? Or assume worker posts it?
        // Let's assume worker posts initial state via reset/tick on start.
        console.log("Initialization complete.");

        // *** DEBUG: Temporarily disable touchmove prevention ***
        /*
        document.addEventListener('touchmove', function(event) {
            let targetElement = event.target;
            let allowScroll = false;
            while (targetElement && targetElement !== document.body) {
                if ((targetElement.classList.contains('settings-content') || targetElement.id === 'playlist') && targetElement.scrollHeight > targetElement.clientHeight) {
                    allowScroll = true;
                    break;
                }
                if (targetElement.type === 'range') {
                     allowScroll = true;
                     break;
                }
                targetElement = targetElement.parentElement;
            }
            if (!allowScroll) {
                 // console.log("Preventing touchmove"); // Debug log
                 event.preventDefault();
            }
        }, { passive: false });
        */

        // Attempt to start audio context on first interaction anywhere
        // This might be more reliable on mobile
        // const startAudioHandler = async () => {
        //     await startAudioContext();
        //     // Remove the listener after the first interaction
        //     document.body.removeEventListener('touchstart', startAudioHandler, { capture: true });
        //     document.body.removeEventListener('click', startAudioHandler, { capture: true });
        // };
        // document.body.addEventListener('touchstart', startAudioHandler, { capture: true, once: true });
        // document.body.addEventListener('click', startAudioHandler, { capture: true, once: true });


    </script>
